name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: VEUX
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tools/kernel-manifest.py"
      - "tools/strictify-dxb.py"
      - "tools/verify-veux-wrapper.py"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'VEUX' }}
  VEUX_BUILD_ID: ${{ github.run_id }}
  # The root is intentionally RW only when both explicit args are present.
  # Keep veuxlog disabled: its fixed userdata-tail range can overlap HFS+.
  VEUX_BOOT_ARGS: "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 rootrw=1 ufsrw=1 veuxfb=1 veuxfbconsole=1 ignition_level=1 launchd_unsecure_cache=1 wdt=-1 wdt_test=no_user_checkin launchd_verbose_coalition_logs=1 launchd_log_verbose_meta_limit=128 veux_spawn_driver=1 veux_gui=1 veux_gui_noconsole=1"

jobs:
  build:
    # macos-15-intel avoids the constrained ARM64 pool. Patch 0104 backports
    # Xcode 16 iig's kernel-only IORPC.kernelContent field to xnu-8796.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Repository and patch structure preflight
        run: |
          python3 tools/validate-repo.py
          for required in debug=0xc serial=3 cpus=1 veuxfb=1 veuxfbconsole=1 rootrw=1 ufsrw=1 veux_spawn_driver=1 veux_gui=1 veux_gui_noconsole=1; do
            case " $VEUX_BOOT_ARGS " in
              *" $required "*) ;;
              *) echo "required diagnostic boot argument missing: $required" >&2; exit 1 ;;
            esac
          done
          case " $VEUX_BOOT_ARGS " in
            *" veuxlog=1 "*) echo "refusing the overlapping persistent tail logger" >&2; exit 1 ;;
          esac

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          build_id = __import__('os').environ['VEUX_BUILD_ID']
          for patch in (Path('xnu/patches/0117-veux-post-early-boot-liveness.patch'),
                        Path('xnu/patches/0120-veux-unconditional-early-console-build-id.patch')):
              source = patch.read_text()
              assert '__VEUX_BUILD_ID__' in source, patch
              patch.write_text(source.replace('__VEUX_BUILD_ID__', build_id))
          PY
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          cp xnu/patches/SKIP_ALLOWLIST.txt patch-skip-allowlist.txt
          # libfirehose_kernel is built arm64e-only; the SWEET/VEUX kernels are plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          python3 tools/strictify-dxb.py dxb/build.sh
          bash -n dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists; Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 16\.'
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          PATCH_STATUS_FILE: ${{ github.workspace }}/patch-status.txt
          PATCH_ALLOWLIST_FILE: ${{ github.workspace }}/patch-skip-allowlist.txt
          # make -k gathers compiler diagnostics; patch application itself is fail-fast.
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          bash build.sh
          if [[ "$MACHINE_CONFIG" == "VEUX" ]]; then
            grep -Fq 'veux_wait_monitor_start();' xnu/osfmk/kern/startup.c
            grep -Fq 'vw_capture(void)' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'Clear the new line on every advance' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'veux_bsd_stage(5);' xnu/bsd/kern/bsd_init.c
            grep -Fq 'veux_bsd_stage(13)' xnu/bsd/kern/bsd_init.c
            grep -Fq 'veux_bsd_stage(8)' xnu/bsd/vfs/vfs_subr.c
            grep -Fq '#define VW_PER_PAGE 4u' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'for (unsigned y = 868; y < 1816; ++y)' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'veux_bsd_stage(6)' xnu/bsd/vfs/vfs_subr.c
            grep -Fq 'veux_bsd_stage(7)' xnu/bsd/vfs/vfs_subr.c
            grep -Fq 'ARM64_BOARD_CONFIG_VEUX' xnu/bsd/kern/syscalls.master
            grep -Fq 'frame[1]' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'veux_bsd_stage(14)' xnu/bsd/kern/kern_exec.c
            grep -Fq 'veux_lifecycle_stage(0)' xnu/bsd/kern/kern_exec.c
            grep -Fq 'veux_lifecycle_stage(1)' xnu/bsd/kern/kern_exec.c
            grep -Fq 'veux_lifecycle_stage(2)' xnu/bsd/kern/kern_exit.c
            grep -Fq 'veux_lifecycle_stage(3)' xnu/bsd/kern/kern_exit.c
            grep -Fq 'bsd/dev/veux_liveness.c' xnu/bsd/conf/files
            grep -Fq 'veux_liveness_start();' xnu/osfmk/console/serial_console.c
            grep -Fq 'VEUX LIVE: processes=' xnu/bsd/dev/veux_liveness.c
            grep -Fq 'VEUX WAIT: launchd threads=' xnu/osfmk/kern/exception.c
            grep -Fq 'waitq_kind: 1=queue 2=turnstile 3=port' xnu/osfmk/kern/exception.c
            grep -Fq 'thread->waitq.wq_q != NULL' xnu/osfmk/kern/exception.c
            grep -Fq 'kdp_sema_find_owner(thread->waitq.wq_q' xnu/osfmk/kern/exception.c
            grep -Fq 'owner_pid=%llu context=0x%llx' xnu/osfmk/kern/exception.c
            grep -Fq 'machine_trace_thread64(thread' xnu/osfmk/kern/exception.c
            grep -Fq 'VEUX STACK MAIN: tid=%llu attempted=%u skipped: %s result=%d frames=%u flags=0x%x' xnu/osfmk/kern/exception.c
            grep -Fq 'VEUX STACK MAIN FRAMES: tid=%llu' xnu/osfmk/kern/exception.c
            grep -Fq 'VEUX VM: launchd shared_base=' xnu/osfmk/kern/exception.c
            grep -Fq 'veux_reboot_request((uint32_t)howto' xnu/bsd/kern/kern_shutdown.c
            grep -Fq 'VEUX reboot requested howto=0x%x' xnu/bsd/kern/kern_shutdown.c
            grep -Fq 'message_hex=' xnu/bsd/kern/kern_shutdown.c
            grep -Fq 'veux_log_flush_sync(void)' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'lck_mtx_try_lock(&sweet_ufs_lock)' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'VEUX haltRestart entry type=0x%x ring_flush=0x%x' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'VEUX PSCI: reset in %u seconds' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'VEUX PSCI: countdown complete ring_flush=0x%x' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq '(void)veux_log_flush_sync();' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'VEUX PSCI: conduit=%s function=0x%llx' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'IORegistryEntry::fromPath("/psci", gIODTPlane)' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'register uint64_t x0 __asm__("x0")' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'smc #0' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'hvc #0' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'veux_lifecycle_stage(5)' xnu/iokit/Kernel/IOPlatformExpert.cpp
            grep -Fq 'reboot howto=0x' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'veux_reboot_frames' xnu/osfmk/arm64/veux_early.c
            grep -Fq '#if defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/iokit/Kernel/IOService.cpp
            grep -Fq '!defined(ARM64_BOARD_CONFIG_SWEET) && !defined(ARM64_BOARD_CONFIG_VEUX)' xnu/iokit/Kernel/IOService.cpp
            grep -Fq 'veux_panic_screen(panic_format_str, panic_args, panic_caller)' xnu/osfmk/kern/debug.c
            grep -Fq 'VEUX_FB_PANIC_TAIL_TOP + veux_fb_panic_row * 16u' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'veux_fb_panic_console_tail(void)' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/bsd/sweet_hfs/core/hfs_vfsutils.c
            grep -Fq 'defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/bsd/vm/vm_unix.c
            grep -Fq 'defined(SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/osfmk/prng/entropy.c
            # The upstream builder can warn and skip an incompatible patch
            # while still returning success. Require the VEUX bring-up edits
            # in the actual tree before accepting the kernel artifact.
            grep -Fq "IOClass'         = VeuxPlatformExpert" xnu/iokit/KernelConfigTables.cpp
            grep -Fq "IOClass'         = VeuxCPU" xnu/iokit/KernelConfigTables.cpp
            grep -Fq 'class VeuxCPU' xnu/iokit/Kernel/arm/VeuxCPU.cpp
            grep -Fq "iokit/Kernel/arm/VeuxCPU.cpp" xnu/iokit/conf/files.arm64
            grep -Fq '#if defined(SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/osfmk/vm/vm_kern.c
            grep -Fq '#if defined(SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/bsd/kern/kern_trustcache.c
            grep -Fq 'SWEET/VEUX: trust caches unavailable' xnu/bsd/kern/kern_trustcache.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/libkern/crypto/corecrypto_aes.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/libkern/crypto/corecrypto_md5.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/libkern/crypto/sweet_md5.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/libkern/crypto/sweet_dec32le.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/libkern/crypto/sweet_enc32le.c
            grep -Fq 'ifneq ($(filter SWEET VEUX,$(CURRENT_MACHINE_CONFIG)),)' xnu/libkern/conf/Makefile.template
            grep -Fq 'PE_init_veux_pmsg();' xnu/osfmk/arm64/arm_vm_init.c
            grep -Fq 'PE_init_veux_pmsg(void)' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'vaddr = ml_io_map(paddr, *pmsg_size);' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'XNU VEUX pmsg device-map v2' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'veux_fb_init();' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'veux_mark_block 0, 0xffff0000' xnu/osfmk/arm64/start.s
            grep -Fq 'veux_early_relocate(VEUX_EARLY_ALIAS + 0x1200000)' xnu/osfmk/arm64/arm_vm_init.c
            grep -Fq 'veux_stage_mark(4)' xnu/pexpert/arm/pe_fiq.c
            grep -Fq 'veux_stage_mark(5)' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'VEUX kprintf route active' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'veux_diag_kernel_entry(get_saved_state_pc(state), fault_addr)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_diag_vm_before(get_saved_state_pc(state), fault_addr, &veux_snapshot)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_diag_vm_after(get_saved_state_pc(state), fault_addr, result, &veux_snapshot)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_diag_return(get_saved_state_pc(state), far)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_diag_panic(get_saved_state_pc(ss))' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_diag_tick(get_saved_state_pc(state))' xnu/osfmk/arm64/sleh.c
            grep -Fq 'at s1e1w, %0\n\tisb' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'tlbi vaae1is, %0\n\tdsb ish\n\tisb' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'vd_run >= 8' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'report->occurrence != 2' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'veux_stage_mark_nb(unsigned int cell)' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'veux_stage_flush(void)' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'vd_first_par = immediate' xnu/osfmk/arm64/veux_early.c
            grep -Fq 'vd_walk_core' xnu/osfmk/arm64/veux_early.c
            grep -Fq '800u - VEUX_FB_CONSOLE_TOP' xnu/pexpert/arm/pe_serial.c
            ! grep -Fq 'veux_discard_kprintf' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'veux_irq_probe();' xnu/osfmk/arm64/machine_routines.c
            grep -Fq 'veux_stage_mark(7)' xnu/osfmk/kern/startup.c
            grep -Fq 'veux_stage_mark(8)' xnu/osfmk/kern/startup.c
            grep -Fq 'LEXT(veux_fault_dump)' xnu/osfmk/arm64/start.s
            grep -Fq 'VEUX_EXCEPTION_CELL 4' xnu/osfmk/arm64/locore.s
            grep -Fq 'VEUX_EXCEPTION_CELL 5' xnu/osfmk/arm64/locore.s
            grep -Fq 'veux_fault_dump(esr,' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_probe_interrupt(1)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'veux_probe_interrupt(0)' xnu/osfmk/arm64/sleh.c
            grep -Fq 'VEUX_FB_HEIGHT             2400u' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'VEUX_FB_STRIDE             4320u' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'format=a8r8g8b8' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'ml_io_map_wcomb((vm_offset_t)VEUX_FB_BASE, VEUX_FB_SIZE)' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'VEUX simplefb marker wrote white 32x32 at 0x85200000' xnu/pexpert/arm/pe_serial.c
            grep -Fq 'VEUX BUILD: ID=' xnu/pexpert/arm/pe_serial.c
            grep -Fq '0120-veux-unconditional-early-console-build-id.patch' ../patch-status.txt
            grep -Fq '0121-veux-launchd-main-stack-exec-trace.patch' ../patch-status.txt
            grep -Fq '0122-veux-xpcproxy-driver-spawn-gate.patch' ../patch-status.txt
            grep -Fq '0123-veux-software-display-services.patch' ../patch-status.txt
            grep -Fq '0124-veux-display-enumeration-trace.patch' ../patch-status.txt
            grep -Fq '0125-veux-software-framebuffer-registry-properties.patch' ../patch-status.txt
            grep -Fq '0126-veux-iomfb-client-start-fallback.patch' ../patch-status.txt
            grep -Fq 'setProperty("IOMFBLaunchFDR", false)' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: FDR policy provider=%u service=%u' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: IOMFB base start rejected; continuing software client' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: IOMFB client ready process=%s' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: validated firmware framebuffer; software scanout only' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: first valid software display present' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: /arm-io found; disp0=%u' xnu/iokit/Kernel/arm/VeuxPlatformExpert.cpp
            grep -Fq 'VEUX GUI: AppleCLCD start provider=%s' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX GUI: IOMFB user client provider=%s framebuffer=%u' xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
            grep -Fq 'VEUX SPAWN DEV ALLOW: rule=pid1-xpcproxy-driver-bootarg hook=exec_validate_spawnattr_policy/IOCurrentTaskHasEntitlement' xnu/bsd/kern/kern_exec.c
            grep -Fq 'error = 0; /* Bypass only this entitlement gate; image and MAC checks still run. */' xnu/bsd/kern/kern_exec.c
            grep -Fq 'followup=normal-image-signature-vnode-exec-and-launch-constraints' xnu/bsd/kern/kern_exec.c
            grep -Fq 'strcmp(veux_spawn_path, "/usr/libexec/xpcproxy") == 0' xnu/bsd/kern/kern_exec.c
            grep -Fq 'PE_parse_boot_argn("veux_spawn_driver", &dev_allow, sizeof(dev_allow))' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX SPAWN TARGET: path=%s stage=exec_activate_image result=0 csflags=0x%x CS_VALID=%u CS_PLATFORM_BINARY=%u' xnu/bsd/kern/kern_exec.c
            grep -Fq 'error == EPERM' xnu/bsd/kern/kern_exec.c
            grep -Fq 'proctype == POSIX_SPAWN_PROC_TYPE_DRIVER' xnu/bsd/kern/kern_exec.c
            grep -Fq 'dev_allow == 1' xnu/bsd/kern/kern_exec.c
            grep -Fq 'exec_resettextvp(p, imgp);' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX SPAWN DENY: return_site=exec_validate_spawnattr_policy policy=IOCurrentTaskHasEntitlement' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX SPAWN RETURN: return_site=exec_activate_image stage=exec_mach_imgact+exec_activate_image' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX IMGACT RETURN: return_site=exec_activate_image activator=%s' xnu/bsd/kern/kern_exec.c
            grep -Fq 'if (proc_getpid(p) == 1 && error != -1' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX MAC HOOK DENY: stage=mac_vnode_check_exec policy=%s hook=mpo_vnode_check_exec' xnu/security/mac_vfs.c
            grep -Fq 'if (proc_getpid(vfs_context_proc(ctx)) == 1 && hook_result != 0)' xnu/security/mac_vfs.c
            grep -Fq 'VEUX MAC DENY: policy=%s hook=mpo_proc_check_launch_constraints' xnu/security/mac_process.c
            grep -Fq 'VEUX STACK MAIN: tid=%llu attempted=%u skipped: %s result=%d frames=%u flags=0x%x' xnu/osfmk/kern/exception.c
            grep -Fq 'main_trace_result = machine_trace_thread64(thread' xnu/osfmk/kern/exception.c
            grep -Fq 'VEUX MAIN WAIT: tid=%llu' xnu/osfmk/kern/exception.c
            grep -Fq 'VEUX SPAWN FAIL: pid=1 parent=%d name=%s path=%s stage=%s errno=%d path_errno=%d attempt=%u' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX EXEC: pid=1 name=%s path=%s errno=%d path_errno=%d' xnu/bsd/kern/kern_exec.c
            grep -Fq 'VEUX EXIT: pid=%d name=%s status=0x%x exit_status=%d signal=%d' xnu/bsd/kern/kern_exit.c
            grep -Fq 'VEUX MAC DENY: policy=mac_vnode_check_exec' xnu/bsd/kern/kern_exec.c
            grep -Eq 'IORPCMessage[[:space:]]*\*[[:space:]]*kernelContent;' xnu/iokit/IOKit/IORPC.h
            grep -Eq 'IORPCMessage[[:space:]]*\*[[:space:]]*kernelContent;' xnu/iokit/DriverKit/IORPC.h
            grep -Fq 'veux_log_append(c, size)' xnu/osfmk/console/serial_console.c
            grep -Fq 'static void veux_log_start(bool userdata_partition)' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'on != 1' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'veux_bsd_stage(16); /* first successful UFS block read */' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'veux_bsd_stage(17); /* first UFS block-read failure */' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'error=0x%x lba=0x%llx count=0x%x' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'first successful UFS write' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'first UFS write failure' xnu/bsd/dev/sweet_ufs.c
            grep -Fq 'VEUX ROOT mode=' xnu/bsd/vfs/vfs_subr.c
            grep -Fq 'VEUX ROOT mode=%s rootrw=%u ufsrw=%u' xnu/bsd/vfs/vfs_subr.c
            grep -Fq 'if (rootrw == 1 && ufsrw == 1)' xnu/bsd/vfs/vfs_subr.c
            grep -Fq 'su.writable = (rw == 1 && rootrw == 1);' xnu/bsd/dev/sweet_ufs.c
            grep -Fq '0119-veux-require-explicit-rw-pair.patch' ../patch-status.txt
            grep -Fq 'VEUX MOUNT helper exit' xnu/bsd/kern/kern_exit.c
            grep -Fq 'if (isroot && ronly) {' xnu/bsd/sweet_hfs/core/hfs_vfsops.c
            grep -Fq 'VEUX HFS: read-only root journal replay disabled' xnu/bsd/sweet_hfs/core/hfs_vfsops.c
            grep -Fq 'vfs_flags(hfsmp->hfs_mp) & MNT_ROOTFS' xnu/bsd/sweet_hfs/core/hfs_vfsutils.c
            grep -Fq 'veux_fb_console_putc(c)' xnu/pexpert/arm/pe_kprintf.c
            grep -Fq 'PE_parse_boot_argn("veuxsandbox"' xnu/bsd/kern/sweet_amfi.c
            grep -Fq 'veuxiolog' xnu/iokit/Kernel/IOUserClient.cpp
            grep -Fq 'veuxnull' xnu/bsd/dev/mem.c
            grep -Fq 'PE_parse_boot_argn("veuxscan"' xnu/osfmk/kern/exception.c
            grep -Fq 'ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)' xnu/bsd/vfs/kpi_vfs.c
            python3 - <<'PY'
          from pathlib import Path

          serial = Path("xnu/pexpert/arm/pe_serial.c").read_text()
          console = Path("xnu/osfmk/console/serial_console.c").read_text()
          region = serial.split("#if defined(ARM64_BOARD_CONFIG_VEUX)\n/*\n * Static simple-framebuffer", 1)[1].split("#endif /* ARM64_BOARD_CONFIG_VEUX */", 1)[0]
          probe = region.split("veux_fb_init(void)", 1)[1]
          fbcon = region.split("void\nveux_fb_console_putc(char c)", 1)[1]
          kprintf = Path("xnu/pexpert/arm/pe_kprintf.c").read_text()
          ufs = Path("xnu/bsd/dev/sweet_ufs.c").read_text()
          halt = Path("xnu/iokit/Kernel/IOPlatformExpert.cpp").read_text()
          shutdown = Path("xnu/bsd/kern/kern_shutdown.c").read_text()
          amfi = Path("xnu/bsd/kern/sweet_amfi.c").read_text()
          entitlements = Path("xnu/iokit/Kernel/arm/SweetEntitlements.cpp").read_text()
          bsd_init = Path("xnu/bsd/kern/bsd_init.c").read_text()
          iokit_user_client = Path("xnu/iokit/Kernel/IOUserClient.cpp").read_text()
          memdev = Path("xnu/bsd/dev/mem.c").read_text()
          startup = kprintf.split("PE_init_kprintf(void)", 1)[1].split("STARTUP(KPRINTF", 1)[0].split("#else", 1)[0]
          pmsg_init = kprintf.split("PE_init_veux_pmsg(void)", 1)[1].split("\n#endif", 1)[0]
          vm = Path("xnu/osfmk/arm64/arm_vm_init.c").read_text()
          assert "veux_pmsg_init()" not in startup, "VEUX pmsg mapping still runs in early kprintf startup"
          assert vm.index("early I/O page tables ready") < vm.index("PE_init_veux_pmsg();"), "VEUX pmsg must wait for early I/O page tables"
          assert "veux_fb_init();" in pmsg_init, "initialize the VEUX framebuffer after early I/O tables are ready"
          assert 'PE_parse_boot_argn("veuxfb"' not in probe and 'PE_parse_boot_argn("veuxfbconsole"' not in probe, "early framebuffer must not depend on optional boot arguments"
          assert "int write_marker = 1;" in probe and "int enable_console = 1;" in probe, "early framebuffer marker and console are unconditional"
          assert "VEUX_FB_BASE               0x85200000ULL" in region and "VEUX_FB_SIZE               0x00c00000u" in region, "use the supplied simple-framebuffer region"
          assert "VEUX_FB_WIDTH              1080u" in region and "VEUX_FB_HEIGHT             2400u" in region, "use the RGB-probe-validated geometry"
          assert "VEUX_FB_STRIDE             4320u" in region and "format=a8r8g8b8" in region, "use the supplied stride and pixel format"
          assert "ml_io_map_wcomb((vm_offset_t)VEUX_FB_BASE, VEUX_FB_SIZE)" in probe, "map the firmware-declared framebuffer directly"
          assert "address != VEUX_FB_BASE" not in region and "dsi_active" not in region and "VEUX_SDE_BASE" not in region, "do not gate writes on live SDE register checks"
          assert "VEUX simplefb marker wrote white 32x32 at 0x85200000" in region, "successful screen marker must remain uniquely identifiable"
          assert "veux_fb_console_base = fb" in probe and "veux_fb_console_ready = true" in probe, "enable console after the direct map succeeds"
          assert 'VEUX BUILD: ID=' in probe and 'veux_fb_console_putc(build_id_line[i])' in probe, "print the build ID directly through the framebuffer console"
          early = Path("xnu/osfmk/arm64/veux_early.c").read_text()
          stage_fn = early.split("veux_stage_mark_nb(unsigned int cell)", 1)[1].split("veux_stage_flush(void)", 1)[0]
          assert "veux_stage_mark_nb(unsigned int cell)" in early and "if (cell >= 22) return;" in stage_fn and "PE_parse_boot_argn" not in stage_fn, "early stage cells are compiled independently of veuxfb boot arguments"
          assert "veux_stage_mark(2);" in early and "veux_stage_mark(3);" in early, "early arm and platform stages mark cells before userland"
          assert "Clear the new line on every advance" in fbcon and "VEUX_FB_CONSOLE_FG" in region, "clear console lines on wrap; keep foreground glyphs"
          assert "veux_fb_console_putc(c)" in kprintf, "route VEUX printk to the simple-framebuffer console"
          assert "veux_log_append(c, size)" in console, "mirror the active XNU console printk path into the UFS log ring"
          assert "os_atomic_store(&veux_log_total, at + 1, release)" in ufs, "publish log bytes only after storing them"
          assert "!PE_parse_boot_argn(\"veuxlog\", &on, sizeof(on)) || on != 1" in ufs, "userdata writes must require veuxlog=1 explicitly"
          assert "!userdata_partition || su.lun != 0" in ufs, "persistent logs are limited to userdata on LUN 0"
          assert "su.log_first_block = su.first_block + su.nblocks - VEUX_LOG_BLOCKS" in ufs, "persistent log writes remain bounded to the reserved partition tail"
          assert "veux_log_flush_sync(void)" in ufs and "lck_mtx_try_lock(&sweet_ufs_lock)" in ufs and "ufs_sync_cache()" in ufs, "reboot and panic ring flushes are synchronous and never block on the UFS lock"
          assert "message_hex=" in shutdown and "veux_log_flush_sync()" in shutdown, "record the reboot request and flush it before shutdown proceeds"
          assert "VEUX PSCI: reset in %u seconds" in halt and "IODelay(1000000)" in halt, "show a 10-second on-screen PSCI countdown before reset"
          assert "defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)" in bsd_init, "register the built-in AMFI compatibility policy on VEUX"
          assert "defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)" in amfi, "compile the AMFI provider for VEUX"
          assert "#if defined(SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)" in entitlements, "compile the shared XML entitlements provider for VEUX"
          assert "PE_parse_boot_argn(\"veuxsandbox\"" in amfi and "enable_sandbox != 1" in amfi, "the permissive Sandbox stand-in must stay explicitly opt-in"
          assert "PE_parse_boot_argn(\"veuxiolog\"" in iokit_user_client and "defined(ARM64_BOARD_CONFIG_VEUX)" in iokit_user_client, "compile the opt-in IOKit trace for VEUX"
          assert "PE_parse_boot_argn(\"veuxnull\"" in memdev, "compile the opt-in /dev/null tee for VEUX"
          assert "defined(ARM64_BOARD_CONFIG_SWEET) || defined(ARM64_BOARD_CONFIG_VEUX)" in Path("xnu/bsd/kern/kern_exit.c").read_text(), "record user-process crash details on VEUX"
          assert "veuxscan" in Path("xnu/osfmk/kern/exception.c").read_text(), "gate heap-string scans by a VEUX boot argument"
          PY
            echo "Verified VEUX CPU, bounded userdata logging, unconditional direct simple-framebuffer console/build ID, AMFI, and opt-in userspace diagnostics"
          fi

      - name: Host diagnostic bounds checks (synthetic memory only)
        if: inputs.machine_config == 'VEUX'
        run: |
          python3 tools/test-veux-console.py dxb/xnu diag-host
          python3 tools/test-veux-frames.py dxb/xnu diag-host
          python3 tools/test-veux-psci-adt.py

      - name: Kernel feature manifest
        if: success() && env.MACHINE_CONFIG == 'VEUX'
        run: |
          KERNEL=$(find dxb/fakeroot/System/Library/Kernels -type f -name '*development*veux*' -print -quit)
          test -n "$KERNEL"
          python3 tools/kernel-manifest.py \
            --kernel "$KERNEL" \
            --patch-status patch-status.txt \
            --build-id "$VEUX_BUILD_ID" \
            --boot-args "$VEUX_BOOT_ARGS" \
            --source-root dxb/xnu \
            --output out/manifest.json

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp patch-status.txt out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
